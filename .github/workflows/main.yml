name: Build LaTeX document

on: 
  push:
  pull_request:
    types:
      - closed
    branches:
      - master



jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document Introduction
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Introduction/

      - name: Compile LaTeX document Stability
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Stability/

      - name: Compile LaTeX document Control
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Control/

      - name: Compile LaTeX document Laplace
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Laplace/

      - name: Compile LaTeX document Bode
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Bode/

      - name: Compile LaTeX document Discrete
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Discrete/

      - name: Compile LaTeX document HJB_LQR
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/HJB_LQR/

      - name: Compile LaTeX document Observer
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Observer/

      - name: Compile LaTeX document Controllability
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Controllability/

      - name: Compile LaTeX document Filters
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Filters/

      - name: Compile LaTeX document Kalman
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/Kalman/

      - name: Compile LaTeX document LyapunovTheory
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides_RU/LyapunovTheory/




      - name: Save Introduction artifact
        uses: actions/upload-artifact@v4
        with:
          name: Introduction.pdf
          path: Slides_RU/Introduction/main.pdf

      - name: Save Stability artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stability.pdf
          path: Slides_RU/Stability/main.pdf

      - name: Save Control artifact
        uses: actions/upload-artifact@v4
        with:
          name: Control.pdf
          path: Slides_RU/Control/main.pdf

      - name: Save Laplace artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laplace.pdf
          path: Slides_RU/Laplace/main.pdf

      - name: Save Bode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bode.pdf
          path: Slides_RU/Bode/main.pdf

      - name: Save Discrete artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discrete.pdf
          path: Slides_RU/Discrete/main.pdf

      - name: Save HJB_LQR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HJB_LQR.pdf
          path: Slides_RU/HJB_LQR/main.pdf

      - name: Save Observer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Observer.pdf
          path: Slides_RU/Observer/main.pdf

      - name: Save Controllability artifact
        uses: actions/upload-artifact@v4
        with:
          name: Controllability.pdf
          path: Slides_RU/Controllability/main.pdf

      - name: Save Filters artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filters.pdf
          path: Slides_RU/Filters/main.pdf

      - name: Save Kalman artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalman.pdf
          path: Slides_RU/Kalman/main.pdf

      - name: Save LyapunovTheory artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyapunovTheory.pdf
          path: Slides_RU/LyapunovTheory/main.pdf




      - name: Update compiled PDFs in git repository
        if: github.event.pull_request.merged == true || github.event_name == 'push'
        run: |
          mv Slides_RU/Introduction/main.pdf Slides_RU/Introduction.pdf
          mv Slides_RU/Stability/main.pdf Slides_RU/Stability.pdf
          mv Slides_RU/Control/main.pdf Slides_RU/Control.pdf
          mv Slides_RU/Laplace/main.pdf Slides_RU/Laplace.pdf
          mv Slides_RU/Bode/main.pdf Slides_RU/Bode.pdf
          mv Slides_RU/Discrete/main.pdf Slides_RU/Discrete.pdf
          mv Slides_RU/HJB_LQR/main.pdf Slides_RU/HJB_LQR.pdf
          mv Slides_RU/Observer/main.pdf Slides_RU/Observer.pdf
          mv Slides_RU/Controllability/main.pdf Slides_RU/Controllability.pdf
          mv Slides_RU/Filters/main.pdf Slides_RU/Filters.pdf
          mv Slides_RU/Kalman/main.pdf Slides_RU/Kalman.pdf
          mv Slides_RU/LyapunovTheory/main.pdf Slides_RU/LyapunovTheory.pdf
          
          git config --global user.name 'CI PDF compiler'
          git config --global user.email '<>'
          git add Slides_RU/Introduction.pdf
          git add Slides_RU/Stability.pdf
          git add Slides_RU/Control.pdf
          git add Slides_RU/Laplace.pdf
          git add Slides_RU/Bode.pdf
          git add Slides_RU/Discrete.pdf
          git add Slides_RU/HJB_LQR.pdf
          git add Slides_RU/Observer.pdf
          git add Slides_RU/Controllability.pdf
          git add Slides_RU/Filters.pdf
          git add Slides_RU/Kalman.pdf
          git add Slides_RU/LyapunovTheory.pdf


          git commit -m "Update compiled PDFs"
          git push
